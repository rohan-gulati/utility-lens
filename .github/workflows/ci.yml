name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Data integrity first: a broken citation is a worse bug than a broken build.
      - run: npm run validate
      - run: npx tsc --noEmit
      - run: npm run build
